<!DOCTYPE html>
<!--
  Documentation Page Template
  Variables (replace before deployment):
    {{TITLE}}          - Page title (used in <title>, og:title)
    {{DESCRIPTION}}    - Meta description (150-160 chars)
    {{CANONICAL_PATH}} - Relative URL path from site root
    {{CSS_PATH}}       - Path prefix to css/ (e.g. '../../../')
    {{JS_PATH}}        - Path prefix to js/ (e.g. '../../../')
    {{PRODUCT}}        - Product name (SAM, CLIO, ALICE, Shared)
    {{BREADCRUMB}}     - Breadcrumb nav HTML
    {{CONTENT}}        - Page content (H1 + body)
    {{DATA_PREV}}      - data-prev attribute for pagination (optional)
    {{DATA_NEXT}}      - data-next attribute for pagination (optional)
    {{TABLE_OF_CONTENTS}} - Set to 'true' to show TOC (optional)
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | {{PRODUCT}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="https://www.syntheticautonomicmind.org/{{CANONICAL_PATH}}">
    <meta property="og:title" content="{{TITLE}} | {{PRODUCT}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.syntheticautonomicmind.org/{{CANONICAL_PATH}}">
    <meta property="og:image" content="https://www.syntheticautonomicmind.org/images/{{PRODUCT_KEY}}.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{TITLE}} | {{PRODUCT}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <link rel="stylesheet" href="{{CSS_PATH}}css/styles.css?v=15">
</head>
<body>
    <div id="nav-placeholder"></div>

    <!-- Documentation Content -->
    <main>
        <article class="doc-page" data-product="{{PRODUCT_KEY}}" data-doc-path="{{CANONICAL_PATH}}"{{DATA_PREV}}{{DATA_NEXT}}>
            <div class="doc-container">
                <nav class="doc-breadcrumb" aria-label="Breadcrumb">
                    {{BREADCRUMB}}
                </nav>

                <div class="doc-content{{TOC_CLASS}}">
                    {{CONTENT}}
                </div>
            </div>
        </article>
    </main>

    <div id="footer-placeholder"></div>
    <script src="{{JS_PATH}}main.js?v=15"></script>
    <script src="{{JS_PATH}}include.js"></script>
</body>
</html>
